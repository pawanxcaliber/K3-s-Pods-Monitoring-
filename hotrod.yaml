apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotrod
  namespace: monitoring
  labels:
    app: hotrod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotrod
  template:
    metadata:
      labels:
        app: hotrod
    spec:
      containers:
      - name: hotrod
        image: grafana/hotrod:latest
        imagePullPolicy: IfNotPresent
        args: ["all"]
        ports:
        - containerPort: 8080
        env:
        # Pointing traces to our Tempo service
        - name: JAEGER_AGENT_HOST
          value: "tempo.monitoring"
        - name: JAEGER_AGENT_PORT
          value: "6831"
---
apiVersion: v1
kind: Service
metadata:
  name: hotrod
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: hotrod
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
